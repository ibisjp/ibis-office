[package]
name = "ibis-jtd"
description = "Read-only Ichitaro (.jtd, .jtt, .jttc) import for ibisOffice. Converts to the document model."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ibis-doc-model.workspace = true
ibis-formats.workspace = true
ibis-ooxml.workspace = true
# LHA (LH5) decompression for the compressed .jttc / .jtdc form (MIT OR Apache-2.0).
delharc = { version = "0.8", default-features = false }
