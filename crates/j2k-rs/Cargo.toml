[package]
name = "j2k-rs"
description = "Pure-Rust JPEG 2000 (ISO/IEC 15444-1) encoder and decoder for codestreams (.j2k/.j2c) and JP2 containers (.jp2)."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hayro-jpeg2000 = { version = "0.3", default-features = false, features = ["std"] }
