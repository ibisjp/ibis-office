[package]
name = "ibis-office-base"
description = "What every ibisOffice crate shares and that needs nothing of the window: the clock, the user's settings and data folder, the UI's words (i18n) and the CMYK converter in use."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ibis-doc-model.workspace = true
ibis-pptx.workspace = true
gpui-kit.workspace = true
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# The system's locale (clock/local_date.rs); the version the app uses (MIT).
objc = "0.2.7"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
# The scenario tests keep the user's data under target/scenario-user-data (app_data.rs).
scenarios = []
# Unit tests (the app's own test target turns it on): the same, under the system's temp folder.
test-user-data = []

# The `objc` crate's msg_send!/class! macros test `cfg(feature = "cargo-clippy")`, which is not a feature of this crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
