[package]
name = "ibis-office-app"
description = "ibisOffice presentation editor front end (GPUI + gpui-component)."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ibisOffice"
path = "src/main.rs"

[dependencies]
unicode-vo = "0.1.0" # MIT: Unicode vertical orientation, already in the dependency graph.
unicode-width = "0.2" # MIT OR Apache-2.0: East Asian Width, already in the dependency graph.
ibis-calc.workspace = true
ibis-office-base.workspace = true
ibis-office-render.workspace = true
# The editor window and what every format shares (tasks/doc/crate-split-plan.md, 12).
ibis-office-shell.workspace = true
# The presentation screen (PPTX), a crate of its own (tasks/doc/crate-split-plan.md, 14).
ibis-office-pptx.workspace = true
# The document screen (DOCX), a crate of its own (tasks/doc/crate-split-plan.md, 15).
ibis-office-docx.workspace = true
# The workbook screen (XLSX), a crate of its own (tasks/doc/crate-split-plan.md, 16).
ibis-office-xlsx.workspace = true
# `#[editor_ext]`: the methods a format writes for the editor become extension traits (tasks/doc/crate-split-plan.md, 10).
ibis-office-macros.workspace = true
ibis-doc-model.workspace = true
# ICC profiles for CMYK colours (pure Rust; BSD-3-Clause OR Apache-2.0; also in the tree through `image`).
moxcms = "0.8"
ibis-pptx.workspace = true
ibis-emf.workspace = true
ibis-eot.workspace = true
gpui-kit.workspace = true
lyon_tessellation = "1.0"
log = "0.4"
# Pair kerning of the typeface drawn, for Word's w:kern (docx layout). The
# version GPUI's tree already has (MIT): HarfBuzz in Rust, reading the
# font's kern table and GPOS pair adjustments.
harfrust = "=0.5.2"
# A maths font's OpenType MATH table and glyph shapes, for typesetting formulas (render/math_font.rs). Already in the tree
# (MIT OR Apache-2.0).
ttf-parser = "0.25"

# For the `export` feature: GPUI's headless renderer is part of its test
# support, which also turns on GPUI's entity leak tracking (a small cost).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
gpui-pre-platform = { version = "=0.3.6", features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "tiff"], optional = true }
miniz_oxide = { version = "0.8", optional = true }
# The raw four planes of a CMYK or YCCK JPEG (render/cmyk_jpeg.rs), converted with the CMYK converter in use. The versions the
# `image` crate already uses (MIT OR Apache-2.0 OR Zlib); the `image` crate cannot give a four-component picture as it is.
zune-jpeg = { version = "=0.4.21", optional = true }
zune-core = { version = "=0.4.12", optional = true }
# Vector PDF export: pages as text, paths and images (MIT OR Apache-2.0).
# Without its text shaping (the export hands it positioned glyphs); its
# images feature is what takes pixels, and rayon (already a dependency of
# the workspace) writes pages and fonts on several threads.
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images", "rayon"], optional = true }
# The characters of the glyphs embedded, from the fonts' cmaps (the version
# krilla uses; MIT OR Apache-2.0).
skrifa = { version = "=0.42.1", optional = true }
# Trying each font's subset before the PDF is written (the version krilla
# uses; MIT OR Apache-2.0): a font it cannot subset is drawn as outlines.
subsetter = { version = "=0.2.6", optional = true }
# An SVG read into shapes and glyph outlines, to write it as a vector PDF (svg_pdf.rs: the picture a copy as a picture puts on the
# clipboard; the version GPUI already uses; MIT OR Apache-2.0).
usvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"], optional = true }

# Automatic update (shell/update.rs): the log, paths and versions it shares with ibisOfficeUpdater.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ibis-office-updater = { path = "../ibis-office-updater" }
# Another app changing an open file (shell/file_watch.rs): the operating system's file watcher (CC0-1.0; FSEvents, inotify,
# ReadDirectoryChangesW). Already in the tree through gpui-component; futures' channel (MIT OR Apache-2.0) carries its events.
notify = "7"
futures = { version = "0.3", default-features = false, features = ["std"] }

# macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
# GPUI's macOS platform (already a dependency of gpui-pre-platform, patched
# to forks/gpui-pre-macos): the export draws glyphs without font smoothing.
gpui-pre-macos = { version = "=0.3.6", optional = true }
# 動画・音声の再生 (media_player.rs): AVFoundation called through the
# Objective-C runtime (objc, MIT), and the CoreVideo buffers of the video's
# frames GPUI draws as a surface (the versions GPUI uses; MIT OR Apache-2.0).
objc = "0.2.7"
core-video = "0.5.2"
core-foundation = "0.10.1"
# Text drawn on a handout page (export_text.rs): CoreText and CoreGraphics, the versions GPUI already uses.
core-text = "21"
core-graphics = "0.24"

# For the `export` feature on Windows: the headless DirectX renderer of
# ibisOffice's fork of the Windows platform (GPUI has none for Windows).
[target.'cfg(windows)'.dependencies]
# MIT/Apache-2.0; use the native MediaPlayer and copy decoded frames through Direct3D.
windows = { version = "0.61.3", features = ["Foundation", "Graphics_DirectX_Direct3D11", "Media_Core", "Media_Playback", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_UI_Shell"] }

gpui-pre-windows = { version = "=0.3.6", features = ["test-support"], optional = true }

[features]
default = ["export"]
# The scenario tests' driver (ibis-office-shell's `scenario.rs`) and their list (`src/scenario_list.rs`), for tests/scenarios.rs;
# turned on for this crate's own tests by the dev-dependency below.
scenarios = ["export", "ibis-office-docx/scenarios", "ibis-office-xlsx/scenarios", "ibis-office-pptx/scenarios", "ibis-office-shell/scenarios", "ibis-office-base/scenarios", "ibis-office-render/scenarios"]
# `--export png|pdf|pdf-image|ui` on the command line (macOS, Windows and Linux;
# build.rs sets `cfg(headless_export)` for it).
export = ["dep:gpui-pre-platform", "dep:gpui-pre-windows", "dep:gpui-pre-wgpu", "dep:image", "dep:miniz_oxide", "dep:zune-jpeg", "dep:zune-core", "dep:krilla", "dep:skrifa", "dep:subsetter", "dep:usvg", "dep:gpui-pre-macos", "ibis-office-docx/export", "ibis-office-xlsx/export", "ibis-office-pptx/export", "ibis-office-shell/export", "ibis-office-render/export"]

# For the `export` feature on Linux: the headless renderer of ibisOffice's
# fork of GPUI's wgpu renderer (GPUI has none for Linux).
[target.'cfg(target_os = "linux")'.dependencies]
gpui-pre-wgpu = { version = "=0.3.6", features = ["test-support"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# Reading a fetched response's body (the art borders' pictures); the version
# GPUI already uses.
futures = { version = "0.3", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"
# The glyphs' outlines (render/glyph_outline.rs), as on the desktop: the glow of text is one blurred picture of them. The version krilla
# uses (MIT OR Apache-2.0), already in the tree.
skrifa = "=0.42.1"
# The picture types of GPUI (`RenderImage` takes `image::Frame`) and the PNG writer of the zoom cards (pptx/zoom_cards.rs); the same
# crate as the desktop one, already in the tree through GPUI.
image = { version = "0.25", default-features = false, features = ["png"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# This crate's tests build it with the scenario driver.
[dev-dependencies]
ibis-office-app = { path = ".", features = ["scenarios"] }
ibis-office-base = { workspace = true, features = ["test-user-data"] }

# Scenario tests run their own main: GPUI's Mac platform must be made on the
# main thread, where libtest's test functions do not run.
[[test]]
name = "scenarios"
harness = false


# The `objc` crate's msg_send!/class! macros test `cfg(feature = "cargo-clippy")`, which is not a feature of this crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
