[package]
name = "ibis-mcp"
description = "The MCP server of ibisOffice (GitHub issue #159): JSON-RPC over stdio in front of ibis-doc-service. `ibisOffice --mcp`, and `ibisOffice-mcp` for Windows (whose ibisOffice.exe has no standard input and output)."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ibisOffice-mcp"
path = "src/main.rs"

[dependencies]
ibis-doc-service.workspace = true
serde_json = "1"
# The HTTP transport (`--http <port>`, GitHub issue #231): a small blocking HTTP/1.1 server (MIT OR Apache-2.0; no TLS: it listens on 127.0.0.1 only and the Secure MCP Tunnel carries the HTTPS).
tiny_http = { version = "0.12", default-features = false }
